services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: passoguia
      POSTGRES_PASSWORD: passoguia
      POSTGRES_DB: passoguia
    ports:
      - "5432:5432"
    volumes:
      - passoguia-postgres:/var/lib/postgresql/data

volumes:
  passoguia-postgres:
