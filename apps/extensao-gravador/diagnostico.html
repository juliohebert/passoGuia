<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassoGuia — diagnóstico PRE (redação fail-safe)</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 16px;
        color: #1e293b;
        background: #f8fafc;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      #status {
        font-size: 12px;
        color: #64748b;
        margin: 0 0 12px;
      }
      button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      .registro {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px;
        margin: 12px 0;
        max-width: 900px;
      }
      .acao {
        font-weight: 600;
        margin: 0 0 2px;
      }
      code {
        font-size: 11px;
        color: #64748b;
      }
      .registro img {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        display: block;
        margin: 8px 0 6px;
      }
      .meta {
        font-size: 11px;
        color: #475569;
        margin: 0;
      }
      .vazio {
        font-size: 12px;
        color: #94a3b8;
        font-style: italic;
      }
      .registro.inseguro {
        border-color: #f59e0b;
        background: #fffbeb;
      }
      .aviso {
        font-size: 12px;
        font-weight: 600;
        color: #b45309;
        margin: 6px 0 4px;
      }
      .motivos {
        margin: 0;
        padding-left: 18px;
        font-size: 11px;
        color: #92400e;
      }
    </style>
  </head>
  <body>
    <h1>Diagnóstico PRE-AÇÃO (campos redigidos + destaque) — prova temporária</h1>
    <p id="status">carregando…</p>
    <p><button id="atualizar" type="button">Atualizar</button></p>
    <div id="registros"></div>
    <script src="dist/diagnostico.js"></script>
  </body>
</html>
